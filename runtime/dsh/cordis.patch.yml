# Profile layer applied on top of the shipped `web` profile.
#
# Why this file exists
# --------------------
# `dsh-base` mounts `@deepseek-ai/dsh-bash-sandbox` as the bash executor. That
# executor wraps every command through `ctx.sandbox` (`dsh-sandbox-local`), which
# on Linux requires a working `bwrap` or Landlock runner. Inside PRoot neither
# exists: PRoot is a ptrace-based userland emulator, not a kernel confinement
# mechanism. The provider is fail-closed, so every bash call would fail with
# SANDBOX_UNAVAILABLE instead of running.
#
# This layer swaps the *executor* only:
#   - `bash-sandbox` is disabled by id and `bash-local` is inserted in its place;
#   - `sandbox` / `sandbox-policy` stay mounted, so `fs-sandbox` keeps fencing
#     file writes through ctx.fs;
#   - `approval` and `permission` still gate tool calls.
#
# Patch syntax notes (see apps/cli/reference/README.md):
#   - a bare `- id:` row *modifies* an existing entry and fails if the id is
#     absent;
#   - new rows must be wrapped in `insert:`.

- id: bash-sandbox
  disabled: true

- insert:
    - id: bash-local
      name: '@deepseek-ai/dsh-bash-local'
      config:
        timeoutMs: 60000
        maxTimeoutMs: 600000

# Profile layer applied on top of the shipped `web` profile.
#
# Why this file exists
# --------------------
# `dsh-base` mounts `@deepseek-ai/dsh-bash-sandbox` as the bash executor. That
# executor wraps every command through `ctx.sandbox` (`dsh-sandbox-local`), which
# on Linux requires a working `bwrap` or Landlock runner. Inside PRoot neither
# exists: PRoot is a ptrace-based userland emulator, not a kernel confinement
# mechanism. The provider is fail-closed, so every bash call would fail with
# SANDBOX_UNAVAILABLE instead of running.
#
# This layer swaps the executor for the unconfined local one and drops the
# plugins that only make sense over a confining executor:
#
#   - `bash-sandbox` is disabled, `bash-local` is inserted in its place;
#   - `permission` is disabled: PermissionPresetService refuses to mount when the
#     bash executor does not confine ("the mounted bash executor does not
#     confine (no sandboxMode)"), because a preset bundles a sandbox mode and
#     would silently promise confinement that cannot be enforced;
#   - `approval` stays: it still asks before tool calls, which is the remaining
#     safety boundary;
#   - `sandbox` / `sandbox-policy` stay mounted so `fs-sandbox` keeps fencing
#     file writes through ctx.fs.
#
# Patch syntax notes (see apps/cli/reference/README.md):
#   - a bare `- id:` row *modifies* an existing entry and fails if the id is
#     absent;
#   - new rows must be wrapped in `insert:`.

- id: bash-sandbox
  disabled: true

- id: permission
  disabled: true

# Directory picking: `-auto` probes the host at boot and falls back to `browse`
# when it cannot prove a native chooser is reachable. On Android that probe has
# no display and no zenity/kdialog, so pinning `browse` removes the guesswork and
# gives the Web UI a working "Choose workspace" dialog.
- id: directory-picker
  name: '@deepseek-ai/dsh-host-directory-picker-browse'

- insert:
    - id: bash-local
      name: '@deepseek-ai/dsh-bash-local'
      config:
        timeoutMs: 60000
        maxTimeoutMs: 600000

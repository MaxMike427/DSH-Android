name: build-runtime

# The payload must be produced on native ARM64 Linux: it extracts Ubuntu Base
# and executes its binaries to install Node.js and DeepSeekRuntime.
on:
  workflow_dispatch:
    inputs:
      ubuntu_version:
        description: Ubuntu Base 24.04.x point release
        required: false
        default: "24.04.5"
      dsh_version:
        description: DeepSeekRuntime npm version
        required: false
        default: "0.2.2-rc.3"
  push:
    branches: [main]
    paths:
      - "scripts/build-rootfs.sh"
      - "scripts/patch-proot-prefix.sh"
      - "scripts/smoke-rootfs.sh"
      - ".github/workflows/build-runtime.yml"

permissions:
  contents: read

jobs:
  payload:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Host facts
        run: uname -a && df -h /

      - name: Host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd xz-utils binutils perl

      - name: Reject CRLF line endings in shell scripts
        # A stray \r makes bash fail with "command not found" on a line that
        # looks correct, which is how a payload build once died at the very end.
        run: |
          if grep -rlI $'\r' scripts/ 2>/dev/null; then
            echo "CRLF line endings found in scripts/" >&2
            exit 1
          fi
          echo "line endings ok"

      - name: Build payload
        env:
          UBUNTU_VERSION: ${{ inputs.ubuntu_version || '24.04.5' }}
          DSH_VERSION: ${{ inputs.dsh_version || '0.2.2-rc.3' }}
          OUT_DIR: ${{ github.workspace }}/app/src/main/assets
        run: bash scripts/build-rootfs.sh

      - name: Smoke-test payload
        # PRoot resolves its loader through the device-absolute prefix, so the
        # check unpacks at /data/data/com.dshapp/files and runs as root.
        run: sudo -E bash scripts/smoke-rootfs.sh

      - name: Upload payload
        uses: actions/upload-artifact@v4
        with:
          name: dsh-runtime-arm64
          # Keep repo-relative paths; the apk job downloads into the workspace
          # root so app/src/main/assets is reproduced exactly.
          path: |
            app/src/main/assets/rootfs.tar.xz
            app/src/main/assets/proot.tar.xz
            app/src/main/assets/runtime-manifest.json
          if-no-files-found: error
          retention-days: 14

  apk:
    needs: payload
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download payload
        uses: actions/download-artifact@v4
        with:
          name: dsh-runtime-arm64
          path: payload

      - name: Place payload in assets
        # Artifact path semantics differ between upload/download versions, so the
        # files are located by name rather than assumed to land in place.
        run: |
          mkdir -p app/src/main/assets
          for name in rootfs.tar.xz proot.tar.xz runtime-manifest.json; do
            found="$(find payload -name "$name" -type f -print -quit)"
            if [ -z "$found" ]; then
              echo "payload artifact is missing $name" >&2
              find payload -maxdepth 4 -type f >&2 || true
              exit 1
            fi
            cp "$found" "app/src/main/assets/$name"
          done
          ls -lh app/src/main/assets

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        # Extraction bugs only surface on a device otherwise; these tests cover
        # the tar reader, including truncated and escaping archives.
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Assemble debug APK
        env:
          # Shown in the app and in `dumpsys package`, so an installed APK can be
          # traced to the exact build.
          DSH_VERSION_NAME: ${{ github.sha }}
          DSH_BUILD_ID: ${{ github.run_id }}
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Verify the APK actually contains the runtime payload
        # A missing asset produces an APK that installs but cannot extract
        # anything, which is exactly the failure this check exists to prevent.
        run: |
          apk="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          [ -n "$apk" ] || { echo "no APK produced" >&2; exit 1; }
          echo "APK: $apk ($(stat -c%s "$apk") bytes)"
          listing="$(unzip -l "$apk" | awk '{print $4}')"
          for entry in assets/proot.tar.xz assets/rootfs.tar.xz assets/runtime-manifest.json; do
            if printf '%s\n' "$listing" | grep -qxF "$entry"; then
              echo "  ok $entry"
            else
              echo "  MISSING $entry" >&2
              printf '%s\n' "$listing" | grep -i assets >&2 || true
              exit 1
            fi
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

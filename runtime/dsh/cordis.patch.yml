# Profile layer applied on top of the shipped `web` profile.
#
# Why this file exists
# --------------------
# `dsh-base` mounts `@deepseek-ai/dsh-bash-sandbox` as the bash executor. That
# executor wraps every command through `ctx.sandbox` (`dsh-sandbox-local`), which
# on Linux requires a working `bwrap` or Landlock runner. Inside PRoot neither
# exists: PRoot is a ptrace-based userland emulator, not a kernel confinement
# mechanism. The provider is fail-closed, so every bash call would fail with
# SANDBOX_UNAVAILABLE instead of running.
#
# `@deepseek-ai/dsh-bash-local` works, but reports `sandboxMode === undefined`, and
# `@deepseek-ai/dsh-permission-presets` refuses to construct in that case. Without
# the presets service, `/api/permissionPresets/catalog` answers 404 and the Web UI
# stops rendering its main surface (observed as a solid background).
#
# `profile-shim.js` subclasses the local executor and reports the mode the
# deployment really guarantees — the PRoot guest boundary, which already confines
# every command to the Ubuntu rootfs. That satisfies the presets service.
#
# Two composition rules matter here:
#   - exactly ONE provider of `ctx.shell`: the shim replaces `bash-local`, so the
#     stock row is disabled rather than left mounted;
#   - `bash-sandbox` stays disabled because its runners cannot work under PRoot.
#
# Patch syntax (see apps/cli/reference/README.md): a bare `- id:` row modifies an
# existing entry and fails when the id is absent; new rows go under `insert:`.

# `bash-sandbox` is the shipped executor. It is disabled because its Linux rungs
# need bwrap or Landlock, neither of which exists under PRoot, and the provider is
# fail-closed (every command would die with SANDBOX_UNAVAILABLE).
#
# There is no `bash-local` row in the base bundle to disable — the shim below is
# the only local executor, inserted as `bash` (the service it provides).
- id: bash-sandbox
  disabled: true

# Directory picking: the shipped `-auto` row probes the host at boot and falls back
# to `browse` when it cannot prove a native chooser is reachable. On Android that
# probe finds no display and no zenity/kdialog, so `auto` already resolves to
# `browse` — the row is left untouched. A patch row that changes `name` is rejected
# as a mismatch ("name mismatch for directory-picker ... skipping"), so it must not
# be restated here.

- insert:
    # The single `ctx.shell` provider: a subclass of dsh-bash-local that also
    # reports a sandbox mode, which is what lets dsh-permission-presets construct.
    - id: bash
      name: './profile-shim.js'
      config:
        timeoutMs: 60000
        maxTimeoutMs: 600000

